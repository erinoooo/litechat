name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Design-system lint
        run: npm run lint:ui
        working-directory: web
      - name: Type-check frontend
        run: npx svelte-check --tsconfig ./tsconfig.json
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o litechat . && ./litechat --version
      - uses: actions/upload-artifact@v4
        with:
          name: litechat-linux
          path: litechat

  python:
    # the Python package against the real binary, oldest and newest Python
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: litechat-linux
      # uv, because setup-python has no 3.8 build for current Ubuntu runners
      - uses: astral-sh/setup-uv@v6
      - name: Test
        run: |
          chmod +x litechat
          LITECHAT_BINARY=$PWD/litechat PYTHONPATH=python uv run --no-project --python ${{ matrix.python }} \
            python -W error::ResourceWarning -m unittest discover -s python/tests -v
