name: Feature request
description: Suggest something liteChat should do
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What you want to do
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Ideas
      description: How it could work. liteChat stays lean, so say how much weight it would add.
